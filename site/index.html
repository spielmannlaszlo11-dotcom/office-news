
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFFICE / NEWS</title>

<style>
:root {
    --accent: #FFB80C;
    --background: #10151D;
    --panel: #151E2B;
    --white: #F6F7F9;
    --muted: #9DA6B6;
    --transition: 450ms;
    --hold: 10s;
    --unit: min(1vw, 1.77778vh);
}

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--background);
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
}

.screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 3.3vh 3.2vw 2.7vh;
    gap: 2vh;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ffffff25;
    padding-bottom: 2vh;
    height: 9vh;
}

.brand {
    display: flex;
    align-items: center;
    gap: 1.2vw;
}

.logo {
    width: 5vh;
    height: 5vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #141414;
    font-weight: 900;
    font-size: 3.8vh;
    letter-spacing: -0.15em;
    padding-right: 0.15em;
}

.brand-name {
    font-size: calc(var(--unit) * 2.2);
    font-weight: 900;
    letter-spacing: -0.055em;
}

.subtitle {
    color: var(--muted);
    font-size: calc(var(--unit) * 0.7);
    letter-spacing: 0.22em;
    margin-top: 0.4vh;
    font-weight: 700;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 2.5vw;
}

.live {
    display: flex;
    align-items: center;
    gap: 0.6vw;
    font-size: calc(var(--unit) * 0.8);
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
}

.live-dot {
    width: 0.65vw;
    height: 0.65vw;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 15px #FFB80C55;
}

.clock {
    text-align: right;
}

.time {
    font-size: calc(var(--unit) * 2.8);
    font-weight: 700;
    letter-spacing: -0.06em;
    font-variant-numeric: tabular-nums;
}

.date {
    color: var(--muted);
    font-size: calc(var(--unit) * 0.85);
}

.categories {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.3vw;
    min-height: 4.5vh;
}

.category {
    color: #A8B2C2;
    padding: 1vh 0.65vw;
    font-size: calc(var(--unit) * 0.92);
    font-weight: 700;
    white-space: nowrap;
    border-radius: 4px;
    transition: background var(--transition),
                color var(--transition);
}

.category.active {
    background: var(--accent);
    color: #171717;
}

.category.empty {
    opacity: 0.4;
}

.stage {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    border-radius: 8px;
    border: 1px solid #ffffff18;
    background: var(--panel);
}

.slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: translateX(1.5%);
    transition: opacity var(--transition) ease,
                transform var(--transition) ease;
    background: #101722;
    overflow: hidden;
    z-index: 2;
}

.slide.active {
    opacity: 1;
    transform: translateX(0);
}

.slide.exit {
    opacity: 1;
    transform: translateX(-1%);
    z-index: 1;
}

.visual {
    position: absolute;
    inset: 0 0 0 32%;
    overflow: hidden;
    background: #182332;
}

.fallback-art {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            ellipse at 70% 45%,
            #FFB80C25,
            transparent 58%
        ),
        repeating-linear-gradient(
            90deg,
            transparent,
            transparent 70px,
            #ffffff04 71px
        ),
        linear-gradient(
            135deg,
            #101722,
            #263344
        );
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 20%;
}

.art-symbol {
    font-size: 18vh;
    font-weight: 900;
    color: #FFB80C45;
    letter-spacing: -0.05em;
}

.photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1.02);
    transition: opacity 350ms ease;
}

.photo.ready {
    opacity: 1;
}

.active .photo.ready {
    animation: photoZoom var(--hold) linear both;
}

@keyframes photoZoom {
    from {
        transform: scale(1.02);
    }
    to {
        transform: scale(1.08);
    }
}

.gradient {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            90deg,
            #101722 0%,
            #101722 25%,
            rgba(16,23,34,0.97) 35%,
            rgba(16,23,34,0.75) 47%,
            rgba(16,23,34,0.18) 72%,
            transparent 100%
        ),
        linear-gradient(
            0deg,
            rgba(8,12,19,0.8),
            transparent 25%
        );
    z-index: 1;
}

.content {
    position: absolute;
    left: 3.2vw;
    top: 5vh;
    bottom: 5vh;
    width: 56%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
}

.kicker {
    color: var(--accent);
    text-transform: uppercase;
    font-size: calc(var(--unit) * 1.05);
    font-weight: 800;
    letter-spacing: 0.17em;
    display: flex;
    align-items: center;
    gap: 0.8vw;
}

.kicker::before {
    content: "";
    width: 1.8vw;
    height: 3px;
    background: var(--accent);
}

.headline {
    margin: 2vh 0 0;
    font-size: calc(var(--unit) * 4.25);
    line-height: 1.04;
    font-weight: 800;
    letter-spacing: -0.045em;
    overflow-wrap: break-word;
    max-width: 100%;
}

.description {
    margin: 2.2vh 0 0;
    font-size: calc(var(--unit) * 1.45);
    line-height: 1.4;
    color: #D0D7E1;
    max-width: 95%;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.metadata {
    display: flex;
    align-items: center;
    gap: 0.8vw;
    margin-top: 3vh;
    color: #BCC5D1;
    font-size: calc(var(--unit) * 1.03);
}

.source {
    color: white;
    font-weight: 700;
}

.credit {
    position: absolute;
    bottom: 2vh;
    right: 1.5vw;
    z-index: 3;
    padding: 0.7vh 0.7vw;
    background: #101722B8;
    color: #D0D7E1;
    font-size: calc(var(--unit) * 0.72);
    max-width: 35%;
}

.chapter {
    position: absolute;
    right: 1.5vw;
    top: 2.5vh;
    z-index: 3;
    font-size: calc(var(--unit) * 0.8);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-shadow: 0 2px 6px black;
}

.active .content {
    animation: textReveal var(--transition) ease-out both;
}

@keyframes textReveal {
    from {
        opacity: 0.5;
        transform: translateY(1vh);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.lower {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 7vh;
    gap: 2vw;
}

.up-next {
    display: flex;
    align-items: center;
    gap: 1.4vw;
    flex: 1;
    min-width: 0;
}

.next-label {
    color: var(--accent);
    font-size: calc(var(--unit) * 0.85);
    letter-spacing: 0.15em;
    font-weight: 800;
    white-space: nowrap;
}

.next-title {
    color: #E5E9F1;
    font-size: calc(var(--unit) * 1.3);
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.counter {
    color: var(--muted);
    font-size: calc(var(--unit) * 1.1);
    white-space: nowrap;
}

.counter strong {
    color: white;
    font-size: calc(var(--unit) * 1.6);
}

.progress {
    height: 0.55vh;
    display: flex;
    gap: 0.3vw;
}

.segment {
    flex: 1;
    background: #FFFFFF20;
    position: relative;
    overflow: hidden;
}

.segment.done {
    background: var(--accent);
}

.fill {
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform-origin: left center;
    animation: progressFill var(--hold) linear forwards;
}

@keyframes progressFill {
    from {
        transform: scaleX(0);
    }
    to {
        transform: scaleX(1);
    }
}

.footer {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: calc(var(--unit) * 0.7);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

@media (orientation: portrait) {
    .categories {
        flex-wrap: wrap;
        justify-content: flex-start;
    }

    .content {
        width: 86%;
    }

    .visual {
        left: 0;
    }

    .gradient {
        background: linear-gradient(
            90deg,
            #101722ee,
            #10172277
        );
    }

    .headline {
        font-size: 7vw;
    }

    .description {
        font-size: 3.5vw;
    }

    .brand-name {
        font-size: 4vw;
    }

    .category {
        font-size: 2.3vw;
    }

    .metadata {
        font-size: 2.8vw;
    }
}
</style>
</head>

<body>

<main class="screen">

    <header class="header">

        <div class="brand">
            <div class="logo">//</div>

            <div>
                <div class="brand-name">
                    OFFICE / NEWS
                </div>

                <div class="subtitle">
                    THE WORLD AT A GLANCE
                </div>
            </div>
        </div>

        <div class="header-right">

            <div class="live">
                <span class="live-dot"></span>
                <span id="status">CONNECTING</span>
            </div>

            <div class="clock">
                <div class="time" id="clock">--:--</div>
                <div class="date" id="date"></div>
            </div>

        </div>
    </header>

    <nav class="categories" id="categories"></nav>

    <section class="stage" id="stage"></section>

    <div class="lower">

        <div class="up-next">
            <span class="next-label">
                UP NEXT / <span id="nextCategory"></span>
            </span>

            <span class="next-title" id="nextTitle"></span>
        </div>

        <div class="counter">
            <strong id="currentNumber">01</strong>
            /
            <span id="totalNumber">01</span>
        </div>

    </div>

    <div class="progress" id="progress"></div>

    <footer class="footer">
        <span id="feedStatus">CONNECTING TO THE GUARDIAN</span>
        <span>BUCHAREST / LOCAL TIME</span>
    </footer>

</main>

<script>
(function () {
    "use strict";

    var STORY_DURATION = 10000;
    var REFRESH_INTERVAL = 300000;
    var TRANSITION_DURATION = 450;
    var CACHE_KEY = "office-news-betfair-v3";

    var categories = [
        "Technology",
        "Artificial Intelligence",
        "Science & Space",
        "Business",
        "World News",
        "Innovation",
        "Cybersecurity",
        "Future of Work",
        "Gaming & Entertainment"
    ];

    var shortNames = [
        "Technology",
        "AI",
        "Science & Space",
        "Business",
        "World",
        "Innovation",
        "Cybersecurity",
        "Future of Work",
        "Gaming & Entertainment"
    ];

    var symbols = [
        "TECH",
        "AI",
        "SPACE",
        "BUSINESS",
        "WORLD",
        "NEXT",
        "SECURE",
        "WORK",
        "PLAY"
    ];

    var waitingStory = {
        id: "waiting",
        category: "Technology",
        title: "Connecting to The Guardian",
        description: "Retrieving the latest headlines from the live news feed.",
        source: "OFFICE / NEWS",
        image: "",
        date: ""
    };

    var demoStories = categories.map(function(category, i) {
        return {
            id: "demo-" + i,
            category: category,
            title: [
                "The next chapter of everyday computing",
                "Artificial intelligence and the future",
                "Exploring the next frontier",
                "A changing global economy",
                "The world through a wider lens",
                "Ideas shaping tomorrow",
                "Building a more resilient digital world",
                "The evolution of the workplace",
                "A new era of interactive entertainment"
            ][i],
            description: "Illustrative content for testing the OFFICE / NEWS display.",
            source: "OFFICE / NEWS - DEMO",
            image: "",
            date: ""
        };
    });

    var hosted = /^https?:$/.test(location.protocol);

    var stories = hosted ? [waitingStory] : demoStories;

    var currentIndex = 0;
    var activeSlide = null;
    var storyTimer = null;
    var refreshTimer = null;
    var pendingStories = null;
    var preloaded = null;
    var requesting = false;
    var lastFingerprint = "";
    var lastUpdate = "";
    var mode = hosted ? "waiting" : "demo";

    function element(id) {
        return document.getElementById(id);
    }

    function create(tag, className, text) {
        var node = document.createElement(tag);

        if (className) {
            node.className = className;
        }

        if (text !== undefined) {
            node.textContent = text;
        }

        return node;
    }

    function pad(number) {
        return number < 10
            ? "0" + number
            : String(number);
    }

    function categoryIndex(category) {
        return Math.max(0, categories.indexOf(category));
    }

    function updateClock() {
        var now = new Date();

        try {
            element("clock").textContent =
                now.toLocaleTimeString("en-GB", {
                    timeZone: "Europe/Bucharest",
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                });

            element("date").textContent =
                now.toLocaleDateString("en-GB", {
                    timeZone: "Europe/Bucharest",
                    weekday: "long",
                    day: "numeric",
                    month: "long"
                });
        } catch (error) {
            element("clock").textContent =
                now.toLocaleTimeString();

            element("date").textContent =
                now.toLocaleDateString();
        }
    }

    function formatDate(value) {
        if (!value) {
            return "";
        }

        var date = new Date(value);

        if (isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleDateString("en-GB", {
            day: "numeric",
            month: "short",
            year: "numeric"
        });
    }

    function updateStatus() {
        var status = element("status");
        var footer = element("feedStatus");

        if (mode === "live") {
            status.textContent = "LIVE FEED";
        } else if (mode === "cached") {
            status.textContent = "CACHED NEWS";
        } else if (mode === "demo") {
            status.textContent = "DEMO MODE";
        } else {
            status.textContent = "CONNECTING";
        }

        if (mode === "demo") {
            footer.textContent =
                "ILLUSTRATIVE CONTENT / NOT LIVE NEWS";
        } else if (mode === "waiting") {
            footer.textContent =
                "WAITING FOR LIVE GUARDIAN NEWS";
        } else {
            var date = new Date(lastUpdate);

            footer.textContent =
                (mode === "cached"
                    ? "CACHED NEWS"
                    : "THE GUARDIAN")
                + " / UPDATED "
                + (
                    isNaN(date.getTime())
                    ? "UNKNOWN"
                    : date.toLocaleString("en-GB", {
                        timeZone: "Europe/Bucharest"
                    })
                );
        }
    }

    function updateCategories(story) {
        var container = element("categories");
        container.textContent = "";

        categories.forEach(function (category, i) {

            var className = "category";

            if (category === story.category) {
                className += " active";
            }

            var available = stories.some(function (item) {
                return item.category === category;
            });

            if (!available) {
                className += " empty";
            }

            container.appendChild(
                create("span", className, shortNames[i])
            );
        });
    }

    function updateProgress() {
        var progress = element("progress");
        progress.textContent = "";

        stories.forEach(function (story, i) {

            var segment = create(
                "div",
                "segment" + (i < currentIndex ? " done" : "")
            );

            if (i === currentIndex) {
                segment.appendChild(create("div", "fill"));
            }

            progress.appendChild(segment);
        });

        element("currentNumber").textContent =
            pad(currentIndex + 1);

        element("totalNumber").textContent =
            pad(stories.length);
    }

    function preload(story) {
        if (!story ||
            !story.image ||
            !/^https:\/\//i.test(story.image)) {
            return null;
        }

        var image = new Image();

        image.className = "photo";
        image.alt = "";
        image.src = story.image;

        return {
            id: story.id,
            image: image
        };
    }

    function fitHeadline(slide) {
        var content = slide.querySelector(".content");
        var headline = slide.querySelector(".headline");

        if (!content || !headline) {
            return;
        }

        var size = parseFloat(
            getComputedStyle(headline).fontSize
        );

        var minimum = size * 0.6;

        while (
            content.scrollHeight > content.clientHeight + 2
            && size > minimum
        ) {
            size -= 2;
            headline.style.fontSize = size + "px";
        }
    }

    function buildSlide(story) {

        var index = categoryIndex(story.category);
        var slide = create("article", "slide");

        var visual = create("div", "visual");
        var fallback = create("div", "fallback-art");

        fallback.appendChild(
            create("div", "art-symbol", symbols[index])
        );

        visual.appendChild(fallback);

        var credit = create(
            "div",
            "credit",
            "OFFICE / NEWS"
        );

        var image = null;

        if (preloaded && preloaded.id === story.id) {
            image = preloaded.image;
        } else {
            var loaded = preload(story);
            image = loaded ? loaded.image : null;
        }

        if (image) {

            visual.appendChild(image);

            function reveal() {
                if (image.naturalWidth > 0) {

                    image.className = "photo ready";

                    credit.textContent =
                        story.credit ||
                        "IMAGE / " + (
                            story.source || "THE GUARDIAN"
                        );
                }
            }

            image.onload = reveal;

            image.onerror = function () {
                if (image.parentNode) {
                    image.parentNode.removeChild(image);
                }
            };

            if (image.complete) {
                reveal();
            }
        }

        slide.appendChild(visual);
        slide.appendChild(create("div", "gradient"));

        slide.appendChild(
            create(
                "div",
                "chapter",
                "THE DAILY BRIEF / " + pad(index + 1)
            )
        );

        var content = create("div", "content");

        content.appendChild(
            create("div", "kicker", story.category)
        );

        content.appendChild(
            create("h1", "headline", story.title)
        );

        if (story.description) {
            content.appendChild(
                create(
                    "p",
                    "description",
                    story.description
                )
            );
        }

        var metadata = create("div", "metadata");

        metadata.appendChild(
            create(
                "span",
                "source",
                story.source || "The Guardian"
            )
        );

        if (story.date) {
            metadata.appendChild(
                create(
                    "span",
                    "",
                    " / " + formatDate(story.date)
                )
            );
        }

        content.appendChild(metadata);

        slide.appendChild(content);
        slide.appendChild(credit);

        return slide;
    }

    function showStory() {
        clearTimeout(storyTimer);

        if (!stories.length) {
            stories = [waitingStory];
            currentIndex = 0;
        }

        var story = stories[currentIndex];
        var oldSlide = activeSlide;
        var slide = buildSlide(story);

        element("stage").appendChild(slide);

        fitHeadline(slide);

        slide.getBoundingClientRect();

        slide.className = "slide active";

        if (oldSlide) {

            oldSlide.className = "slide exit";

            setTimeout(function () {

                if (oldSlide.parentNode) {
                    oldSlide.parentNode.removeChild(oldSlide);
                }

            }, TRANSITION_DURATION + 50);
        }

        activeSlide = slide;

        var next = stories[
            (currentIndex + 1) % stories.length
        ];

        element("nextCategory").textContent =
            shortNames[categoryIndex(next.category)];

        element("nextTitle").textContent = next.title;

        preloaded = preload(next);

        updateCategories(story);
        updateProgress();
        updateStatus();

        storyTimer = setTimeout(
            nextStory,
            STORY_DURATION
        );
    }

    function nextStory() {

        if (pendingStories) {

            var previousId =
                stories[currentIndex]
                ? stories[currentIndex].id
                : "";

            stories = pendingStories;
            pendingStories = null;

            var previousIndex =
                stories.findIndex(function (story) {
                    return story.id === previousId;
                });

            currentIndex = previousIndex >= 0
                ? (previousIndex + 1) % stories.length
                : 0;

        } else {

            currentIndex =
                (currentIndex + 1) % stories.length;
        }

        showStory();
    }

    function organizeStories(items) {

        var seen = {};
        var groups = {};

        categories.forEach(function (category) {
            groups[category] = [];
        });

        items.forEach(function (item) {

            if (!item || !item.title) {
                return;
            }

            if (categories.indexOf(item.category) < 0) {
                return;
            }

            var key = String(
                item.title
            ).trim().toLowerCase();

            if (seen[key]) {
                return;
            }

            seen[key] = true;

            item.id = String(
                item.id || item.link || item.title
            );

            groups[item.category].push(item);
        });

        var result = [];

        for (var round = 0; round < 4; round++) {

            categories.forEach(function (category) {

                if (groups[category][round]) {

                    result.push(
                        groups[category][round]
                    );
                }
            });
        }

        return result;
    }

    function applyFeed(payload, fromCache) {

        if (!payload ||
            !Array.isArray(payload.items) ||
            !payload.items.length) {

            return false;
        }

        var organized = organizeStories(payload.items);

        if (!organized.length) {
            return false;
        }

        lastUpdate = payload.updated || "";

        var timestamp = Date.parse(lastUpdate);

        mode = fromCache ||
               payload.stale ||
               !timestamp ||
               Date.now() - timestamp > 1800000
            ? "cached"
            : "live";

        var fingerprint = JSON.stringify(organized);

        if (fingerprint !== lastFingerprint) {

            lastFingerprint = fingerprint;

            if (
                stories[0].id === "waiting" ||
                stories[0].id.indexOf("demo-") === 0
            ) {

                stories = organized;
                pendingStories = null;
                currentIndex = 0;

                showStory();

            } else {

                pendingStories = organized;
            }
        }

        updateStatus();

        return true;
    }

    function restoreCache() {

        try {

            var cached = localStorage.getItem(CACHE_KEY);

            if (cached) {
                return applyFeed(
                    JSON.parse(cached),
                    true
                );
            }

        } catch (error) {
            console.log("Cache unavailable");
        }

        return false;
    }

    function scheduleRefresh(delay) {

        clearTimeout(refreshTimer);

        refreshTimer = setTimeout(
            refreshNews,
            delay
        );
    }

    function refreshNews() {

        if (!hosted || requesting) {
            return;
        }

        requesting = true;

        var request = new XMLHttpRequest();

        request.open(
            "GET",
            "./news.json?ts=" + Date.now(),
            true
        );

        request.timeout = 15000;

        function failed() {

            requesting = false;

            if (
                mode === "live" ||
                mode === "cached"
            ) {

                mode = "cached";

            } else if (!restoreCache()) {

                mode = "waiting";
            }

            updateStatus();

            scheduleRefresh(15000);
        }

        request.onload = function () {

            try {

                if (request.status !== 200) {

                    throw new Error(
                        "HTTP " + request.status
                    );
                }

                var payload = JSON.parse(
                    request.responseText
                );

                if (!applyFeed(payload, false)) {

                    throw new Error(
                        "No live stories available"
                    );
                }

                try {

                    localStorage.setItem(
                        CACHE_KEY,
                        JSON.stringify(payload)
                    );

                } catch (cacheError) {
                    console.log("Cache storage unavailable");
                }

                requesting = false;

                scheduleRefresh(REFRESH_INTERVAL);

            } catch (error) {

                console.log("Feed error:", error);

                failed();
            }
        };

        request.onerror = failed;
        request.ontimeout = failed;

        request.send();
    }

    document.documentElement.style.setProperty(
        "--accent",
        "#FFB80C"
    );

    document.documentElement.style.setProperty(
        "--hold",
        STORY_DURATION / 1000 + "s"
    );

    updateClock();

    setInterval(updateClock, 1000);

    if (hosted) {
        restoreCache();
    }

    if (!activeSlide) {
        showStory();
    }

    refreshNews();

    window.addEventListener("resize", function () {

        if (activeSlide) {

            var headline =
                activeSlide.querySelector(".headline");

            if (headline) {
                headline.style.fontSize = "";
            }

            fitHeadline(activeSlide);
        }
    });

    document.addEventListener(
        "visibilitychange",
        function () {

            if (!document.hidden && hosted) {
                refreshNews();
            }
        }
    );

})();
</script>

</body>
</html>
